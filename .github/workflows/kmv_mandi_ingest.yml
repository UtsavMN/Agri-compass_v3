name: Krishi Marata Vahini Daily Mandi Ingestion

on:
  schedule:
    # 13:30 UTC = 19:00 IST (Daily evening ingestion after Karnataka APMC markets publish)
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target report date (YYYY-MM-DD), leave blank for today'
        required: false
        default: ''

jobs:
  scrape-and-ingest:
    name: Scrape KSAMB APMC Prices & Ingest Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run Mandi Ingestion
        env:
          KMV_API_URL: ${{ secrets.KMV_API_URL }}
          KMV_INGEST_KEY: ${{ secrets.KMV_INGEST_KEY }}
        run: |
          if [ -z "$KMV_API_URL" ] || [ -z "$KMV_INGEST_KEY" ]; then
            echo "::error::Missing KMV_API_URL or KMV_INGEST_KEY secret in repository settings."
            exit 1
          fi
          TARGET_DATE="${{ github.event.inputs.target_date }}"
          if [ -z "$TARGET_DATE" ]; then
            python scraper/scrape_unified_kmv.py --ingest --backend-url "$KMV_API_URL" --ingest-key "$KMV_INGEST_KEY"
          else
            python scraper/scrape_unified_kmv.py "$TARGET_DATE" --ingest --backend-url "$KMV_API_URL" --ingest-key "$KMV_INGEST_KEY"
          fi
